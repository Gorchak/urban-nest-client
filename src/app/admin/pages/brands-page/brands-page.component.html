<div class="page"><p-confirmDialog/><header><div><span>Каталог</span><h1>Бренди</h1></div><button pButton label="Додати бренд" icon="pi pi-plus" (click)="create()"></button></header><p-table [value]="brands()" [loading]="loading()" [paginator]="true" [rows]="20" responsiveLayout="scroll"><ng-template pTemplate="header"><tr><th>Бренд</th><th>Slug</th><th>Категорії</th><th>Статус</th><th>На головній</th><th></th></tr></ng-template><ng-template pTemplate="body" let-brand><tr><td><a [routerLink]="['/brand',brand.slug]" class="identity">@if(brand.logo){<img [src]="brand.logo" [alt]="brand.name"/>}<strong>{{brand.name}}</strong></a></td><td>{{brand.slug}}</td><td>{{categoryNames(brand)}}</td><td><span [class.active]="brand.isActive&&brand.isVisible">{{brand.isActive&&brand.isVisible?'Активний':'Прихований'}}</span></td><td>{{brand.isFeatured?'Так':'Ні'}}</td><td class="actions"><button pButton icon="pi pi-pencil" class="p-button-text" (click)="edit(brand)"></button><button pButton icon="pi pi-trash" class="p-button-text p-button-danger" (click)="remove(brand)"></button></td></tr></ng-template><ng-template pTemplate="emptymessage"><tr><td colspan="6" class="empty">Брендів ще немає.</td></tr></ng-template></p-table></div><app-add-edit-brand [visible]="dialog()" (visibleChange)="dialog.set($event)" [brand]="selected()" [categories]="categories()" (saved)="onSaved($event)"/>
