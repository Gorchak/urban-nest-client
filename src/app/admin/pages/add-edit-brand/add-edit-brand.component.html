<p-dialog [visible]="visible" (visibleChange)="visibleChange.emit($event)" [modal]="true" [draggable]="false" [style]="{width:'min(760px, 96vw)'}" [header]="brand ? 'Редагувати бренд' : 'Новий бренд'"><form [formGroup]="form" (ngSubmit)="submit()" class="brand-form"><div class="grid">
<label><span>Назва *</span><input pInputText formControlName="name" (input)="onName($any($event.target).value)" /></label><label><span>Slug *</span><input pInputText formControlName="slug" /></label>
<label class="full"><span>Сайт</span><input pInputText formControlName="website" placeholder="https://..." /></label>
<label class="full"><span>Основні категорії</span><p-multiSelect formControlName="categoryIds" [options]="categories" optionLabel="name" optionValue="_id" display="chip" placeholder="Оберіть категорії" /></label><label class="full"><app-single-image-picker formControlName="logo" label="Логотип бренду" /></label>
<label class="full"><span>Опис</span><textarea pInputTextarea formControlName="description" rows="6"></textarea></label><label><span>Порядок</span><p-inputNumber formControlName="sortOrder" /></label>
<div class="checks"><label><p-checkbox formControlName="isFeatured" [binary]="true" /> На головній</label><label><p-checkbox formControlName="isActive" [binary]="true" /> Активний</label><label><p-checkbox formControlName="isVisible" [binary]="true" /> Видимий</label></div>
<label class="full"><span>SEO title</span><input pInputText formControlName="seoTitle" /></label><label class="full"><span>SEO description</span><textarea pInputTextarea formControlName="seoDescription" rows="2"></textarea></label><label class="full"><span>SEO keywords (через кому)</span><input pInputText formControlName="seoKeywords" /></label></div>
@if(submitted()&&form.invalid){<p class="error">Заповніть назву та коректний slug латиницею.</p>}<footer><button pButton type="button" class="p-button-text" label="Скасувати" (click)="close()"></button><button pButton type="submit" label="Зберегти" icon="pi pi-check" [loading]="saving()"></button></footer></form></p-dialog>
