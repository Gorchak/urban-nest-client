[build]
  command = "npm run build"
  publish = "dist/urban-nest/browser"

[[redirects]]
  from = "http://uliastore.com.ua/*"
  to = "https://uliastore.com.ua/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.uliastore.com.ua/*"
  to = "https://uliastore.com.ua/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.uliastore.com.ua/*"
  to = "https://uliastore.com.ua/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
